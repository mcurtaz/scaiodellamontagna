services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: scaio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: directus
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus"]
      interval: 10s
      timeout: 5s
      retries: 5

  directus:
    image: directus/directus:12
    container_name: scaio_directus
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8055:8055"
    environment:
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_URL}
      WEBSOCKETS_ENABLED: "false"
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_ROOT: /directus/uploads
    volumes:
      - ./.directus-data/uploads:/directus/uploads
      - ./.directus-data/extensions:/directus/extensions

  map-generator:
    build: ./map-generator
    container_name: scaio_map_generator
    restart: unless-stopped
    depends_on:
      - directus
    environment:
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN_MAP_GENERATOR}
      DIRECTUS_UPLOAD_FOLDER_ID: ${DIRECTUS_MAP_GENERATOR_FOLDER_ID}

volumes:
  postgres-data:
